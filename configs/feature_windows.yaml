feature_lookback_days: null # null means all available history strictly before cutoff.
outcome_window_days: null # null means campaign post-period uses available days through cutoff.

paths:
  raw: data/raw
  processed: data/processed/features

spark_config: configs/ingestion.yaml
sample_rows: 5
